[package]
name = "enowx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent core: model streaming, tool-calling loop, tools, sessions, roles"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
globset.workspace = true
ignore.workspace = true
regex.workspace = true
tokio-tungstenite.workspace = true
base64.workspace = true
reqwest.workspace = true
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
which = "8.0.6"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-css = "0.25.0"
fs2 = "0.4"

[target.x86_64-unknown-linux-gnu.dependencies]
oliphaunt = "0.3.0"
oliphaunt-extension-vector = "0.3.0"

[target.aarch64-unknown-linux-gnu.dependencies]
oliphaunt = "0.3.0"
oliphaunt-extension-vector = "0.3.0"

[target.aarch64-apple-darwin.dependencies]
oliphaunt = "0.3.0"
oliphaunt-extension-vector = "0.3.0"

[target.x86_64-pc-windows-msvc.dependencies]
oliphaunt = "0.3.0"
oliphaunt-extension-vector = "0.3.0"

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
